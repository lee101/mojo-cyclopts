# Disable the zarr pytest plugin.
#
# The shared test venv has zarr 3.4.0 against numpy 1.26, and zarr.testing
# fails to import at collection time ("module 'numpy.dtypes' has no attribute
# 'StringDType'"). pytest loads third-party plugins through setuptools
# entry points before it reads conftest.py, so nothing inside tests/ can stop
# it; this file can. Nothing in this project uses zarr.
[pytest]
addopts = -p no:zarr
